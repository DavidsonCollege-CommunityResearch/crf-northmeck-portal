# Data Library catalog: every downloadable dataset, grouped into the page's
# sections. data-library.qmd builds the page from this file, and the CSV /
# Excel / codebook downloads read their file names, sources, and column
# descriptions from it too. Add a dataset by copying an entry.
#
#   id        anchor and download key (dlib-<id> on the page)
#   name, description, tags: shown on the page (plain text)
#   keywords  extra words the Data Library search box matches
#   level     "Level of detail" filter: town, county, neighborhood, school,
#             facility, bracket
#   topics    "Topic" filter; themes: "Theme" filter (labels listed below)
#   download  data: the data/<name>.json file to export; file: download name

themes:
  affordability: Affordability
  economic-mobility: Economic mobility
  demographics: Demographics
  racial-equity: Racial equity
sections:
- title: Housing
  datasets:
  - id: economic-trends
    name: Rent, income & home values by town (2018–2024)
    description: >-
      Median gross rent, household income, and home values for Cornelius, Davidson, and Huntersville
      — the foundation for all affordability analysis on the portal. Includes affordability
      ratios and income inequality (Gini).
    keywords: economic trends rent income home values by town 2018-2024
    level: town
    topics: [housing, economics]
    themes: [affordability, economic-mobility]
    tags: [Town · 2018–2024, ACS 5-yr estimates]
    download:
      file: nmidw_economic_trends_2018-2024
      data: dlib-economic-trends
      source: U.S. Census Bureau, American Community Survey (ACS) 5-year estimates
      years: 2018–2024
      codebook:
      - column: town
        type: text
        description: Municipality name (Cornelius, Davidson, or Huntersville)
      - column: year
        type: integer
        description: ACS survey year
      - column: median_rent_monthly_usd
        type: integer
        description: Median gross rent in dollars per month (ACS Table B25064)
      - column: median_household_income_usd
        type: integer
        description: Median household income in dollars (ACS Table B19013)
      - column: median_home_value_usd
        type: integer
        description: Median owner-occupied home value in dollars (ACS Table B25077)
      - column: home_price_to_income_ratio
        type: decimal
        description: >-
          Median home value ÷ median household income. Ratios above 3× are considered unaffordable
          by conventional standards; above 4× signals severe pressure for first-time buyers.
      - column: rent_to_income_pct
        type: decimal
        description: >-
          Annual rent (monthly × 12) as a percentage of median household income. HUD defines
          cost burden at 30%.
      - column: gini_coefficient
        type: decimal
        description: >-
          Gini coefficient for income inequality within the town (0 = perfect equality, 1
          = maximum inequality). Derived from ACS income distribution tables.
      notes: >-
        All dollar values are nominal (not inflation-adjusted). ACS 5-year estimates carry
        a margin of error; small-area figures for Davidson may be imprecise due to small sample
        size.
  - id: housing-burden
    name: Housing cost burden by town (2018–2024)
    description: >-
      Share of renter households spending 30%+ and 50%+ of income on housing, with household
      counts. Shows how displacement pressure has grown in each town since 2018.
    keywords: housing cost burden renter severely burdened by town 2018-2024
    level: town
    topics: [housing]
    themes: [affordability]
    tags: [Town · 2018–2024, ACS 5-yr estimates]
    download:
      file: nmidw_housing_burden_2018-2024
      data: dlib-housing-burden
      source: U.S. Census Bureau, American Community Survey (ACS) 5-year estimates
      years: 2018–2024
      codebook:
      - column: town
        type: text
        description: Municipality name (Cornelius, Davidson, or Huntersville)
      - column: year
        type: integer
        description: ACS survey year
      - column: total_households
        type: integer
        description: Total number of renter households in the town
      - column: cost_burdened_households
        type: integer
        description: Renter households spending 30–50% of gross income on housing (ACS CHAS)
      - column: severely_cost_burdened_households
        type: integer
        description: >-
          Renter households spending more than 50% of gross income on housing (ACS CHAS).
          At this level, households have less than half their income for food, healthcare,
          transportation, and savings.
      - column: cost_burden_rate_pct
        type: decimal
        description: Share of renter households that are cost-burdened (spending 30%+), as
          a percentage
      notes: >-
        Cost burden is measured for renter households only. The 30% threshold is the HUD standard
        definition of housing cost burden. ACS 5-year estimates.
  - id: burden-by-bracket
    name: Cost burden by income bracket, renter & owner (2024)
    description: >-
      Household counts by town, tenure (renter/owner), income bracket, and burden level —
      reveals which income groups face the most severe housing cost pressure. Key for targeting
      policy interventions.
    keywords: cost burden by income bracket renter owner 2024
    level: bracket
    topics: [housing]
    themes: [affordability]
    tags: [Income bracket · 2024, ACS CHAS / HUD]
    download:
      file: nmidw_cost_burden_by_bracket_2024
      data: dlib-burden-by-bracket
      source: U.S. Census Bureau, ACS Comprehensive Housing Affordability Strategy (CHAS)
        via HUD
      years: '2024'
      codebook:
      - column: town
        type: text
        description: Municipality name (Cornelius, Davidson, or Huntersville)
      - column: tenure
        type: text
        description: 'Housing tenure: Renter or Owner'
      - column: income_bracket
        type: text
        description: Household income bracket (7 levels from Less than $10k to $100k+)
      - column: burden
        type: text
        description: >-
          Cost burden category: Not burdened (<30%), Cost burdened (30-50%), or Severely burdened
          (50%+)
      - column: count
        type: integer
        description: >-
          Estimated number of households in this town/tenure/bracket/burden combination. Zero
          may indicate suppressed small values.
      notes: >-
        Source: ACS CHAS (Comprehensive Housing Affordability Strategy) data via HUD, 2024.
        Small cell counts (under 10 households) are suppressed and shown as 0. Use row totals
        with caution for Davidson due to small sample size.
  - id: ptr-by-bracket
    name: Home purchase affordability by income bracket (2024)
    description: >-
      Years of gross income needed to buy the median home in each town, calculated for every
      income bracket. Shows how far homeownership is out of reach at different points on the
      income spectrum.
    keywords: home price to income ratio years to buy by income bracket 2024
    level: bracket
    topics: [housing, economics]
    themes: [affordability]
    tags: [Income bracket · 2024, ACS 5-yr estimates]
    download:
      file: nmidw_home_affordability_by_bracket_2024
      data: dlib-ptr-by-bracket
      source: U.S. Census Bureau, American Community Survey (ACS) 5-year estimates, 2024
      years: '2024'
      codebook:
      - column: town
        type: text
        description: Municipality name (Cornelius, Davidson, or Huntersville)
      - column: home_value
        type: integer
        description: Median home value in dollars for the town (ACS Table B25077, 2024)
      - column: income_bracket
        type: text
        description: Household income bracket
      - column: midpoint
        type: integer
        description: Midpoint of the income bracket in dollars, used as the denominator for
          the ratio
      - column: ratio
        type: decimal
        description: >-
          Years of gross income to purchase the median home: median_home_value ÷ income_bracket_midpoint.
          Does not account for down payment, mortgage rates, or property taxes.
      notes: >-
        The ratio is a simplified affordability metric. A ratio of 3× is the conventional
        threshold for "affordable" homeownership; ratios above 4× are considered severely
        unaffordable. This metric does not account for mortgage interest rates, which significantly
        affect monthly payment affordability.
- title: Demographics & Income
  datasets:
  - id: demographics
    name: Population, households & racial composition by town (2018–2024)
    description: >-
      Total population, household counts, median household income, and racial/ethnic composition
      (White, Black, Hispanic, Asian, other) for each town by year. Covers North Meck's rapid
      growth and evolving diversity.
    keywords: population households racial composition income by town 2018-2024
    level: town
    topics: [demographics, economics]
    themes: [demographics]
    tags: [Town · 2018–2024, ACS 5-yr estimates]
    download:
      file: nmidw_demographics_2018-2024
      data: dlib-demographics
      source: U.S. Census Bureau, American Community Survey (ACS) 5-year estimates
      years: 2018–2024
      codebook:
      - column: town
        type: text
        description: Municipality name (Cornelius, Davidson, or Huntersville)
      - column: year
        type: integer
        description: ACS survey year
      - column: total_population
        type: integer
        description: Total resident population estimate (ACS Table B01003)
      - column: total_households
        type: integer
        description: Total number of occupied housing units (ACS Table B11001)
      - column: median_household_income_usd
        type: integer
        description: >-
          Median household income in dollars (ACS Table B19013). Includes all income sources
          before taxes.
      notes: >-
        ACS 5-year estimates are rolling averages centered on the reference year. Population
        and household counts reflect ACS estimates, not decennial Census counts. Racial composition
        data is available separately in the portal charts.
- title: Economic Well-Being
  datasets:
  - id: alice-town
    name: ALICE households by town (2024)
    description: >-
      Households below the Federal Poverty Level, households above poverty but below the ALICE
      Threshold (working but unable to afford a basic survival budget), and households above
      the ALICE Threshold, for each town.
    keywords: alice households asset limited income constrained employed by town 2024
    level: town
    topics: [economics]
    themes: [economic-mobility]
    tags: [Town · 2024, United Way ALICE Report]
    download:
      file: nmidw_alice_households_by_town_2024
      data: alice-town
      source: >-
        United Way of North Carolina, ALICE Economic Viability Dashboard (household counts
        modeled against Census ACS income data)
      years: '2024'
      codebook:
      - column: town
        type: text
        description: Municipality name (Cornelius, Davidson, or Huntersville)
      - column: year
        type: integer
        description: Reference year for the estimate
      - column: total_households
        type: integer
        description: Total households in the town
      - column: poverty_households
        type: integer
        description: Households with income below the Federal Poverty Level
      - column: alice_households
        type: integer
        description: >-
          Households above the poverty line but below the ALICE Threshold, meaning income
          doesn't cover a basic survival budget (housing, food, transportation, childcare,
          healthcare) for the area
      - column: above_alice_households
        type: integer
        description: Households with income at or above the ALICE Threshold
      notes: >-
        ALICE stands for Asset Limited, Income Constrained, Employed. It captures households
        working but still unable to afford a basic survival budget, a group the Federal Poverty
        Level alone misses, which matters in a suburban area like North Meck where the poverty
        rate is low but the cost of living is high. This is a single-year (2024) snapshot,
        not a trend. Source: United Way of North Carolina ALICE Report.
  - id: charlotte-housing-wage
    name: Housing wage vs. local occupation wages, Charlotte metro (2025)
    description: >-
      The hourly wage needed to afford a 2-bedroom at Fair Market Rent, compared against BLS
      wage estimates for common local occupations.
    keywords: housing wage vs local occupation wages charlotte 2025
    level: metro
    topics: [housing, economics]
    themes: [affordability]
    tags: [Metro · 2025, NLIHC · BLS OEWS]
    download:
      file: nmidw_charlotte_housing_wage_2025
      data: charlotte-housing-wage
      source: >-
        National Low Income Housing Coalition (NLIHC), Out of Reach 2025; U.S. Bureau of Labor
        Statistics, Occupational Employment & Wage Statistics
      years: '2025'
      codebook:
      - column: occupation
        type: text
        description: Occupation title, or "Housing Wage Needed" for the benchmark row
      - column: hourly_wage
        type: decimal
        description: Hourly wage in dollars
      - column: category
        type: text
        description: '"Benchmark" for the housing wage threshold, "Occupation" for actual
          local wage data'
      notes: >-
        The housing wage is the hourly pay a full-time worker needs so that rent on a 2-bedroom
        unit at Fair Market Rent does not exceed 30% of income. Occupational wages are BLS
        OEWS estimates for the Charlotte-Concord-Gastonia MSA, not North Meck specifically.
  - id: charlotte-fmr-bedroom
    name: Fair Market Rent by bedroom size, Charlotte vs. peer metros (2025)
    description: >-
      HUD Fair Market Rents by unit size for Charlotte, Raleigh, and Atlanta, for cross-metro
      comparison.
    keywords: fair market rent by bedroom size charlotte raleigh atlanta 2025
    level: metro
    topics: [housing]
    themes: [affordability]
    tags: [Metro · 2025, HUD FY2025 FMR]
    download:
      file: nmidw_charlotte_fmr_by_bedroom_2025
      data: charlotte-fmr-bedroom
      source: U.S. Dept. of Housing & Urban Development (HUD), FY2025 Fair Market Rents
      years: '2025'
      codebook:
      - column: region
        type: text
        description: 'Metro area: Charlotte, Raleigh, or Atlanta'
      - column: bedrooms
        type: text
        description: Unit size (Studio through 4-Bedroom)
      - column: fmr
        type: integer
        description: Fair Market Rent in dollars per month
      notes: >-
        FMRs are generally set at the 40th percentile of gross rents for standard-quality
        units in each metro area. Compares Charlotte-Concord-Gastonia against two peer Southeast
        metros, not North Meck specifically.
  - id: charlotte-ami-gap
    name: Affordable rent vs. Fair Market Rent by AMI bracket, Charlotte metro (2025)
    description: >-
      Maximum affordable rent at each Area Median Income tier compared to actual Fair Market
      Rent, by unit size, for the Charlotte HUD Metro FMR Area.
    keywords: affordable rent vs fair market rent by ami bracket charlotte 2025
    level: metro
    topics: [housing]
    themes: [affordability]
    tags:
    - Metro · 2025
    - HUD FY2025 Income Limits & FMR
    download:
      file: nmidw_charlotte_ami_affordability_gap_2025
      data: charlotte-ami-gap
      source: U.S. Dept. of Housing & Urban Development (HUD), FY2025 Income Limits & Fair
        Market Rents
      years: '2025'
      codebook:
      - column: bedrooms
        type: text
        description: Unit size (Studio through 4-Bedroom)
      - column: ami_level
        type: text
        description: Income tier as a percentage of Area Median Income (AMI)
      - column: max_affordable_rent
        type: integer
        description: Maximum rent affordable at 30% of income for this AMI tier, in dollars
          per month
      - column: fmr
        type: integer
        description: Fair Market Rent for the same unit size, in dollars per month, for comparison
      notes: >-
        Charlotte-Concord-Gastonia HUD Metro FMR Area, not North Meck specifically. A household
        is priced out whenever max_affordable_rent falls short of fmr.
  - id: alice-county
    name: ALICE households, Mecklenburg County trend (2010–2024)
    description: >-
      The same ALICE breakdown as the town-level dataset, but for Mecklenburg County as a
      whole across ten reporting years, showing how financial hardship has shifted county-wide
      over time.
    keywords: alice households mecklenburg county trend 2010-2024
    level: county
    topics: [economics]
    themes: [economic-mobility]
    tags: [County · 2010–2024, United Way ALICE Report]
    download:
      file: nmidw_alice_households_mecklenburg_county_2010-2024
      data: alice-county
      source: United Way of North Carolina, ALICE Economic Viability Dashboard
      years: 2010–2024 (biennial, non-consecutive)
      codebook:
      - column: county
        type: text
        description: County name (Mecklenburg County)
      - column: year
        type: integer
        description: Reference year for the estimate
      - column: total_households
        type: integer
        description: Total households in the county
      - column: poverty_households
        type: integer
        description: Households with income below the Federal Poverty Level
      - column: alice_households
        type: integer
        description: Households above the poverty line but below the ALICE Threshold
      - column: above_alice_households
        type: integer
        description: Households with income at or above the ALICE Threshold
      notes: >-
        County-level companion to the town-level ALICE dataset, covering Mecklenburg County
        as a whole across ten reporting years rather than a single year. ALICE reports are
        released roughly every two years, so the year gaps here are expected, not missing
        data. Source: United Way of North Carolina ALICE Report.
  - id: economic-mobility
    name: Education, poverty & unemployment by town (2018–2024)
    description: >-
      Bachelor's/master's attainment rate, poverty rate, and unemployment rate for each town
      by year — three indicators commonly used together as a rough read on economic mobility.
    keywords: economic mobility education poverty unemployment by town 2018-2024
    level: town
    topics: [economics, education]
    themes: [economic-mobility]
    tags: [Town · 2018–2024, ACS 5-yr estimates]
    download:
      file: nmidw_economic_mobility_by_town_2018-2024
      data: economic-mobility
      source: U.S. Census Bureau, American Community Survey (ACS) 5-year estimates
      years: 2018–2024
      codebook:
      - column: town
        type: text
        description: Municipality name (Cornelius, Davidson, or Huntersville)
      - column: year
        type: integer
        description: ACS survey year
      - column: edu
        type: decimal
        description: Share of the population 25+ holding a bachelor's or master's degree,
          as a percentage
      - column: poverty
        type: decimal
        description: Share of the population living below the Federal Poverty Level, as a
          percentage
      - column: unemployment
        type: decimal
        description: Share of the civilian labor force that is unemployed, as a percentage
      notes: >-
        These three rates are commonly used together as a rough proxy for economic mobility,
        though none of them measures mobility directly (movement between income levels over
        time). ACS 5-year estimates.
- title: Education
  datasets:
  - id: school-proficiency
    name: Grade-level proficiency & college/career readiness by school (2024)
    description: >-
      Grade-Level Proficient rate and College/Career Ready rate for every North Meck school,
      with Title I status and grade span.
    keywords: grade level proficiency college career readiness by school 2024
    level: school
    topics: [education]
    themes: [economic-mobility]
    tags: [School · 2024, NC School Report Cards]
    download:
      file: nmidw_school_grade_level_proficiency_2024
      data: grade-level-proficiency
      source: NC Department of Public Instruction, School Report Card data
      years: '2024'
      codebook:
      - column: school
        type: text
        description: School name
      - column: grade_span
        type: text
        description: Grades served by the school (e.g. K-5, 9-12)
      - column: town
        type: text
        description: Town the school is located in
      - column: is_title_1
        type: boolean
        description: Whether the school receives Title I federal funding for high-poverty
          enrollment
      - column: glp
        type: decimal
        description: Grade-Level Proficient rate, as a percentage
      - column: glp_raw
        type: text
        description: >-
          Original state-reported proficiency figure, kept as text since some values are reported
          as a range or suppressed rather than a single number
      - column: ccr
        type: decimal
        description: College/Career Ready rate, as a percentage
      notes: >-
        School-level data naming individual schools alongside performance metrics. Flagged
        for sign-off before public release given the equity sensitivity of school-by-school
        comparisons. Source: NC School Report Cards.
  - id: school-growth
    name: Academic growth by school (2024)
    description: >-
      State growth status and EVAAS growth index for every North Meck school — measures year-over-year
      student progress, not absolute achievement level.
    keywords: school academic growth evaas index by school 2024
    level: school
    topics: [education]
    themes: [economic-mobility]
    tags: [School · 2024, NC School Report Cards]
    download:
      file: nmidw_school_academic_growth_2024
      data: school-academic-growth
      source: NC Department of Public Instruction, School Report Card data (EVAAS growth index)
      years: '2024'
      codebook:
      - column: school
        type: text
        description: School name
      - column: grade_span
        type: text
        description: Grades served by the school
      - column: town
        type: text
        description: Town the school is located in
      - column: status
        type: text
        description: State growth status category (e.g. Exceeded, Met, Not Met)
      - column: index_score
        type: decimal
        description: >-
          EVAAS growth index score. Positive values indicate more growth than expected for
          the year; negative values indicate less
      notes: >-
        Growth measures year-over-year student progress, not absolute achievement level, a
        school can show strong growth while still having a low proficiency rate, or vice versa.
        Same sign-off flag as the other school-level datasets.
  - id: school-graduation
    name: Four-year graduation rate by high school (2024)
    description: Four-year cohort graduation rate for every North Meck high school. High-school
      level only.
    keywords: four year graduation rate by high school 2024
    level: school
    topics: [education]
    themes: [economic-mobility]
    tags: [School · 2024, NC School Report Cards]
    download:
      file: nmidw_four_year_graduation_rate_2024
      data: four-year-school-graduation
      source: NC Department of Public Instruction, School Report Card data
      years: '2024'
      codebook:
      - column: school
        type: text
        description: High school name
      - column: town
        type: text
        description: Town the school is located in
      - column: grad_4yr
        type: decimal
        description: Four-year cohort graduation rate, as a percentage
      - column: grad_4yr_raw
        type: text
        description: >-
          Original state-reported figure, kept as text since some values are suppressed for
          small cohort size rather than reported as a number
      notes: >-
        Applies only to high schools. Small graduating classes can make year-to-year swings
        look larger than they are. Same sign-off flag as the other school-level datasets.
  - id: school-economic-gap
    name: Achievement gap by economic disadvantage, all schools (2024)
    description: >-
      Grade-Level Proficient rate for economically disadvantaged vs. non-disadvantaged students
      at every North Meck school, with the resulting percentage-point gap.
    keywords: achievement gap by economic disadvantage school 2024
    level: school
    topics: [education]
    themes: [economic-mobility]
    tags: [School · 2024, NC School Report Cards]
    download:
      file: nmidw_school_achievement_economic_gap_2024
      data: school-achievement-and-economic-gap
      source: NC Department of Public Instruction, School Report Card data
      years: '2024'
      codebook:
      - column: school
        type: text
        description: School name
      - column: town
        type: text
        description: Town the school is located in
      - column: econ_disadv
        type: decimal
        description: Grade-Level Proficient rate among economically disadvantaged students,
          as a percentage
      - column: not_disadv
        type: decimal
        description: Grade-Level Proficient rate among non-economically-disadvantaged students,
          as a percentage
      - column: gap
        type: decimal
        description: Percentage-point gap between the two groups (not_disadv minus econ_disadv)
      notes: >-
        A separate, high-school-only version of this same comparison exists (school-hs-economic-gap).
        Same sign-off flag as the other school-level datasets given it names individual schools
        alongside an equity gap.
  - id: school-hs-economic-gap
    name: Achievement gap by economic disadvantage, high schools (2024)
    description: Same comparison as the all-schools economic gap dataset, limited to high
      schools.
    keywords: achievement gap by economic disadvantage high school 2024
    level: school
    topics: [education]
    themes: [economic-mobility]
    tags: [School · 2024, NC School Report Cards]
    download:
      file: nmidw_hs_achievement_economic_gap_2024
      data: highschool-achievement-economic-gap
      source: NC Department of Public Instruction, School Report Card data
      years: '2024'
      codebook:
      - column: school
        type: text
        description: High school name
      - column: town
        type: text
        description: Town the school is located in
      - column: econ_disadv
        type: decimal
        description: Grade-Level Proficient rate among economically disadvantaged students,
          as a percentage
      - column: not_disadv
        type: decimal
        description: Grade-Level Proficient rate among non-economically-disadvantaged students,
          as a percentage
      - column: gap
        type: decimal
        description: Percentage-point gap between the two groups (not_disadv minus econ_disadv)
      notes: >-
        High-school-only counterpart to school-economic-gap, which covers all grade levels.
        Same sign-off flag as the other school-level datasets.
  - id: school-race-gap
    name: Proficiency gap by race, by school (2024)
    description: >-
      Grade-Level Proficient rate for White students compared against Black, Hispanic, Asian,
      American Indian, and Two-or-More-Races students at each school where enough students
      are enrolled to report.
    keywords: proficiency gap by race school 2024
    level: school
    topics: [education]
    themes: [racial-equity]
    tags: [School · 2024, NC School Report Cards]
    download:
      file: nmidw_school_race_gap_2024
      data: school-race-gap
      source: NC Department of Public Instruction, School Report Card data
      years: '2024'
      codebook:
      - column: school
        type: text
        description: School name
      - column: comparison_group
        type: text
        description: >-
          Racial/ethnic group being compared against the White student proficiency rate (Black,
          Hispanic, Asian, American Indian, or Two or More Races)
      - column: white_pct
        type: decimal
        description: Grade-Level Proficient rate among White students at the school, as a
          percentage
      - column: comparison_pct
        type: decimal
        description: Grade-Level Proficient rate among the comparison group at the school,
          as a percentage
      - column: gap
        type: decimal
        description: Percentage-point gap (white_pct minus comparison_pct)
      notes: >-
        Each school can appear multiple times, once per comparison group with enough students
        to report. Same sign-off flag as the other school-level datasets.
